SOLVER:
  BATCH_SIZE: 64
  MAX_EPOCH: 100
  LR: 5e-5
  SEED: 42

DA:
  TASK: False
  USE: False

DRUG:
  # 啟用 BiLSTM 編碼器（SELFIES 序列表示）
  USE_BILSTM: True
  VOCAB_SIZE: 100
  LSTM_HIDDEN_DIM: 64
  LSTM_NUM_LAYERS: 2
  LSTM_DROPOUT: 0.2
  NODE_IN_EMBEDDING: 128
  HIDDEN_LAYERS: [128, 128, 128]
  MAX_DRUG_LENGTH: 200
  PADDING: True
  # 啟用藥物物理化學特徵
  USE_FEATURES: True
  FEATURE_DIM: 8

PROTEIN:
  # 啟用 BiLSTM 編碼器
  USE_BILSTM: True
  LSTM_HIDDEN_DIM: 256
  LSTM_NUM_LAYERS: 2
  LSTM_DROPOUT: 0.2
  EMBEDDING_DIM: 128
  FEATURE_DIM: 4
  MAX_PROTEIN_LENGTH: 1200
  PADDING: True

DECODER:
  BINARY: 1

RESULT:
  OUTPUT_DIR: "./result/DrugBAN_DrugBiLSTM_BothFeatures_SupportSet"
  SAVE_MODEL: True

# Support Set Configuration
SUPPORT_SET:
  USE: True
  K: 5
  ALPHA: 0.5
  SAMPLING_STRATEGY: "random"
  AGGREGATION_TRAIN: "mean"
  AGGREGATION_TEST: "median"

# Config below only when you use comet
COMET:
  PROJECT_NAME: "DrugBAN_DrugBiLSTM_BothFeatures_SupportSet"
  TAG: "Both_BiLSTM_BothFeatures_BatLiNet"
