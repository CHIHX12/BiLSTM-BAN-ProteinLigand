SOLVER:
  BATCH_SIZE: 64
  MAX_EPOCH: 100
  LR: 5e-5
  SEED: 42

DA:
  TASK: True  # 保持 True 以啟用 cluster split
  USE: False  # 但不使用 DA 訓練

PROTEIN:
  # 啟用 BiLSTM 編碼器（但不使用物理特徵）
  USE_BILSTM: True
  LSTM_HIDDEN_DIM: 256
  LSTM_NUM_LAYERS: 2
  LSTM_DROPOUT: 0.2
  EMBEDDING_DIM: 128
  FEATURE_DIM: 0  # 不使用蛋白質特徵
  MAX_PROTEIN_LENGTH: 1200
  PADDING: True

DECODER:
  BINARY: 1

RESULT:
  OUTPUT_DIR: "./result/DrugBAN_BiLSTM_NoProteinFeatures_Non_DA"
  SAVE_MODEL: True

COMET:
  PROJECT_NAME: "DrugBAN_BiLSTM_NoProteinFeatures_Non_DA"
  TAG: "GCN_BiLSTM_Protein_NoFeatures_NonDA_Control"
