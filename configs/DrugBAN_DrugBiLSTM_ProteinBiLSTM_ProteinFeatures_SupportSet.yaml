SOLVER:
  BATCH_SIZE: 64
  MAX_EPOCH: 100
  LR: 5e-5
  SEED: 42

DA:
  TASK: False
  USE: False

DRUG:
  # 啟用 BiLSTM 編碼器（但不使用藥物特徵）
  USE_BILSTM: True
  LSTM_HIDDEN_DIM: 256
  LSTM_NUM_LAYERS: 2
  LSTM_DROPOUT: 0.2
  USE_FEATURES: False
  FEATURE_DIM: 0  # 不使用藥物特徵
  MAX_DRUG_LENGTH: 200
  PADDING: True

PROTEIN:
  # 啟用 BiLSTM 編碼器（使用蛋白質特徵）
  USE_BILSTM: True
  LSTM_HIDDEN_DIM: 256
  LSTM_NUM_LAYERS: 2
  LSTM_DROPOUT: 0.2
  EMBEDDING_DIM: 128
  FEATURE_DIM: 4  # 使用蛋白質特徵
  MAX_PROTEIN_LENGTH: 1200
  PADDING: True

DECODER:
  BINARY: 1

RESULT:
  OUTPUT_DIR: "./result/DrugBAN_DrugBiLSTM_ProteinBiLSTM_ProteinFeatures_SupportSet"
  SAVE_MODEL: True

SUPPORT_SET:
  USE: True
  K: 5
  ALPHA: 0.5
  SAMPLING_STRATEGY: "random"
  AGGREGATION_TRAIN: "mean"
  AGGREGATION_TEST: "median"

COMET:
  PROJECT_NAME: "DrugBAN_DrugBiLSTM_ProteinBiLSTM_ProteinFeatures_SupportSet"
  TAG: "BiLSTM_Drug_BiLSTM_Protein_ProteinFeatures_BatLiNet"
