SOLVER:
  BATCH_SIZE: 64
  MAX_EPOCH: 100
  LR: 5e-5
  SEED: 42

DA:
  TASK: False
  USE: False

PROTEIN:
  # 使用 CNN 編碼器（官方版本）
  USE_BILSTM: False
  NUM_FILTERS: [128, 128, 128]  # CNN 濾波器數量
  KERNEL_SIZE: [3, 6, 9]        # CNN 卷積核大小
  EMBEDDING_DIM: 128            # Embedding 維度
  MAX_PROTEIN_LENGTH: 1200      # 最大序列長度（與官方一致）
  PADDING: True

DECODER:
  BINARY: 1

RESULT:
  OUTPUT_DIR: "./result/DrugBAN_SupportSet"
  SAVE_MODEL: True

# Support Set Configuration (BatLiNet-inspired mechanism)
SUPPORT_SET:
  USE: True  # Enable support set mechanism
  K: 5  # Number of support samples per query
  ALPHA: 0.5  # Weight for support path (0 = original only, 1 = support only)
  SAMPLING_STRATEGY: "random"  # Random sampling from training set
  AGGREGATION_TRAIN: "mean"  # Training: average support predictions
  AGGREGATION_TEST: "median"  # Testing: median for robustness against outliers

# Config below only when you use comet
COMET:
  PROJECT_NAME: "DrugBAN_CNN_SupportSet"
  TAG: "CNN_BatLiNet_Integration"
